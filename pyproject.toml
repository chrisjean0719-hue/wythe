[project]
name = "wythe"
version = "0.2.0"
description = "Plan a brick wall in running, stack, or Flemish bond over HTTP"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "pytest>=8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["wythe*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
